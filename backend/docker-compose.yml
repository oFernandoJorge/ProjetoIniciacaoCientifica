
services:
  api:
    build: .
    container_name: api
    ports:
      - "8080:8080"
    depends_on:
      postgres:
          condition: service_healthy
    env_file:
      - .env

  postgres:
    image: postgres:16
    container_name: db_postgres
    restart: always

    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=conexao_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: